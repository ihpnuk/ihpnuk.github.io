name: fetch-photos
on:
  push:
    branches: [photo-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check form
        run: |
          set +e
          mkdir -p linkcheck
          curl -sL -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0' -o /dev/null -w '%{http_code}\n' 'https://www.cognitoforms.com/igbohealthcareprofessionalsnetwork/igbohealthcareprofessionalnetworkihpnukapplytojoin' > linkcheck/form-status.txt
          google-chrome --headless=new --no-sandbox --disable-gpu --window-size=430,6000 --virtual-time-budget=15000 --screenshot=linkcheck/form.png 'https://www.cognitoforms.com/igbohealthcareprofessionalsnetwork/igbohealthcareprofessionalnetworkihpnukapplytojoin'
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom 'https://www.cognitoforms.com/igbohealthcareprofessionalsnetwork/igbohealthcareprofessionalnetworkihpnukapplytojoin' | sed 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 20000 > linkcheck/form-text.txt
          cat linkcheck/form-status.txt; true
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add linkcheck
          git commit -m "Stats check" || echo nothing
          git push origin HEAD:photo-fetch
