name: fetch-photos
on:
  push:
    branches: [photo-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check verification tag
        timeout-minutes: 3
        run: |
          set +e
          mkdir -p linkcheck
          sleep 20; curl -sL -m 30 -H 'Cache-Control: no-cache' 'https://ihpnuk.github.io/?nocache=1' | grep -o '<meta name="google-site-verification"[^>]*>' > linkcheck/gsv.txt
          cat linkcheck/gsv.txt; true
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add linkcheck
          git commit -m "Stats check" || echo nothing
          git push origin HEAD:photo-fetch
