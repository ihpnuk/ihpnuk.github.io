name: fetch-photos
on:
  push:
    branches: [photo-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        run: |
          mkdir -p linkcheck
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for u in https://www.tiktok.com/@ihpnuk https://ihpnuk.github.io/ https://ihpnuk.github.io/news.html https://ihpnuk.github.io/membership.html https://ihpnuk.github.io/contact.html https://ihpnuk.github.io/about.html; do
            code=$(curl -sL -A "$UA" -o /tmp/page.html -w '%{http_code} %{url_effective}' "$u")
            has=$(grep -oi -m1 'ihpnuk' /tmp/page.html | head -1)
            title=$(grep -o '<title[^>]*>[^<]*' /tmp/page.html | head -1 | sed 's/<title[^>]*>//')
            echo "$u | $code | mentions-ihpnuk:${has:-no} | title:$title" >> linkcheck/result.txt
          done
          cat linkcheck/result.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add linkcheck
          git commit -m "Theme photo search" || echo nothing
          git push origin HEAD:photo-fetch
