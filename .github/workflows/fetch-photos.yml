name: fetch-photos
on:
  push:
    branches: [photo-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download chosen photos
        run: |
          mkdir -p photos4
          UA="IHPN-UK-newsletter/1.0 (ihpnuk@outlook.com)"
          curl -sL -A "$UA" -o photos4/eye-exam-kenya.jpg "https://images.rawpixel.com/editor_1024/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDIzLTAzL2ZsNzkzODIxODAwMi1pbWFnZS5qcGc.jpg"
          curl -sL -A "$UA" -o photos4/malaria-test-rwanda.jpg "https://images.rawpixel.com/editor_1024/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDIzLTAzL2ZsNTExMTIwNzgyMjEtaW1hZ2UuanBn.jpg"
          ls -la photos4
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add photos4
          git commit -m "Theme photo search" || echo nothing
          git push origin HEAD:photo-fetch
