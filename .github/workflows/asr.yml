name: asr
on:
  push:
    branches: [claude/project-thread-9ivh81]
    paths: [tts/asr.txt]
permissions:
  contents: write
jobs:
  asr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          pip install -q faster-whisper
          cat > a.py <<'PY'
          import glob
          from faster_whisper import WhisperModel
          m=WhisperModel('small.en',device='cpu',compute_type='int8')
          out=open('tts/transcripts.txt','w')
          for f in sorted(glob.glob('tts/c/*/l*.wav'))+sorted(glob.glob('tts/k/bf_*/l*.wav')):
            segs,_=m.transcribe(f)
            out.write(f+' | '+' '.join(s.text.strip() for s in segs)+'\n'); out.flush()
          PY
          python a.py; cat tts/transcripts.txt
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add tts/transcripts.txt; git commit -m "Transcripts" || true; git pull --rebase origin claude/project-thread-9ivh81; git push origin HEAD:claude/project-thread-9ivh81
