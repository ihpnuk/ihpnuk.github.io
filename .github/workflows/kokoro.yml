name: kokoro
on:
  push:
    branches: [claude/project-thread-9ivh81]
    paths: [tts/kokoro.txt]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          sudo apt-get -qq install -y espeak-ng >/dev/null
          pip install -q "kokoro>=0.9.4" soundfile
          cat > k.py <<'PY'
          import soundfile as sf, numpy as np, os
          from kokoro import KPipeline
          p=KPipeline(lang_code='b')
          lines=[l.strip() for l in open('tts/kokoro.txt') if l.strip()]
          for v in ['bf_emma','bf_lily']:
            os.makedirs(f'tts/k/{v}',exist_ok=True)
            for i,l in enumerate(lines,1):
              a=np.concatenate([x.audio.numpy() for x in p(l,voice=v,speed=0.94)])
              sf.write(f'tts/k/{v}/l{i}.wav',a,24000)
          PY
          python k.py
          ls -laR tts/k
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add tts/k; git commit -m "Kokoro lines" || true; git pull --rebase origin claude/project-thread-9ivh81; git push origin HEAD:claude/project-thread-9ivh81
