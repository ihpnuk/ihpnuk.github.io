name: inspect-lookalike
on:
  push:
    branches: [claude/project-thread-98q8y6]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify links
        run: |
          set +e
          mkdir -p out; R=out/links-check.txt; rm -f $R
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for u in https://ihpnuk.github.io/ https://www.centralnicregistry.com/support/policies/dispute https://www.cloudflare.com/abuse/ https://www.namecheap.com/legal/general/abuse-policy/ https://www.gov.uk/search-for-trademark https://www.gov.uk/how-to-register-a-trade-mark https://www.ihpn.org.uk/ https://search.google.com/search-console/about https://www.google.com/business/ https://www.gov.uk/report-suspicious-emails-websites-phishing https://www.ncsc.gov.uk/collection/phishing-scams/report-scam-website "https://find-and-update.company-information.service.gov.uk/search/companies?q=Igbo+Healthcare" "https://find-and-update.company-information.service.gov.uk/search/companies?q=IHPN"; do
            curl -sS -m 25 -L -A "$UA" -o /dev/null -w "%{http_code} %{url_effective} <- $u\n" "$u" >> $R 2>&1
          done
          curl -sS -m 30 -A "$UA" "https://find-and-update.company-information.service.gov.uk/search/companies?q=Igbo+Healthcare" > ch1.html
          curl -sS -m 30 -A "$UA" "https://find-and-update.company-information.service.gov.uk/search/companies?q=IHPN" > ch2.html
          python3 - >> $R <<'PY'
          import re,html
          for f in ['ch1.html','ch2.html']:
              s=open(f).read()
              for m in re.finditer(r'<li class="type-company">(.*?)</li>',s,re.S):
                  t=html.unescape(re.sub(r'<[^>]+>',' ',m.group(1))); t=' '.join(t.split())
                  h=re.search(r'href="(/company/[^"]+)"',m.group(1))
                  if re.search(r'IHPN|HEALTH',t,re.I): print(f,t,h.group(1) if h else '')
          PY
          cat $R; true
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add out/links-check.txt
          git commit -m "Look-alike inspection results" || echo nothing
          git push origin HEAD:claude/project-thread-98q8y6
